<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- SiteSnap AI: an orange DSLR camera body with a voice wave in the lens, on black -->
  <rect width="512" height="512" rx="96" fill="#000"/>
  <!-- shutter button and viewfinder hump -->
  <rect x="98" y="138" width="62" height="34" rx="10" fill="#ff7a00"/>
  <path d="M196 176l20-58a14 14 0 0 1 13-10h54a14 14 0 0 1 13 10l20 58z" fill="#ff7a00"/>
  <!-- body -->
  <rect x="56" y="162" width="400" height="248" rx="40" fill="#ff7a00"/>
  <!-- grip -->
  <path d="M376 162h40a40 40 0 0 1 40 40v168a40 40 0 0 1-40 40h-40z" fill="#d95f00"/>
  <!-- flash / viewfinder window -->
  <rect x="226" y="132" width="60" height="20" rx="6" fill="#1f1a14"/>
  <!-- lens -->
  <circle cx="236" cy="290" r="112" fill="#1f1a14"/>
  <circle cx="236" cy="290" r="88" fill="none" stroke="#3a332b" stroke-width="10"/>
  <circle cx="236" cy="290" r="64" fill="#2a2420"/>
  <g stroke="#ffb347" stroke-width="15" stroke-linecap="round">
    <line x1="200" y1="274" x2="200" y2="306"/>
    <line x1="224" y1="252" x2="224" y2="328"/>
    <line x1="248" y1="264" x2="248" y2="316"/>
    <line x1="272" y1="278" x2="272" y2="302"/>
  </g>
</svg>
